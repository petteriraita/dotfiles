#download other plugins with some easy keybinds
set -g @plugin 'tmux-plugins/tpm'
# fix tmux defaults to sensible
set -g @plugin 'tmux-plugins/tmux-sensible'
#if computer crashes, this saves the files in the file system
set -g @plugin 'tmux-plugins/tmux-resurrect'
# make tmux session creation faster
set -g @plugin 'omerxx/tmux-sessionx'




# this is needed that tmux allows the sending of images through it
set -g allow-passthrough on



# vim-style copy-mode
set -g mode-keys vi


# Keep tmux in the terminal's alternate screen.  Disabling smcup/rmcup here
# caused Kitty's scrollback to retain redraws from every tmux/Codex session,
# so old sessions appeared when scrolling after a session switch.
#
# Let tmux own wheel scrolling instead; the wheel enters tmux copy mode and
# each pane keeps an isolated history.
set -gu terminal-overrides
set -g mouse on
# Ctrl+wheel changes Kitty's font size through its built-in keyboard shortcuts.
# Kitty 0.43 does not expose wheel events to mouse_map.
# Leave the frozen copy-mode view before resizing so TUIs can redraw and
# rewrap their transcript at the new width. Zoom returns to the live prompt.
bind-key -T root C-WheelUpPane run-shell 'xdotool key --clearmodifiers ctrl+shift+equal'
bind-key -T root C-WheelDownPane run-shell 'xdotool key --clearmodifiers ctrl+shift+minus'
bind-key -T copy-mode C-WheelUpPane send-keys -X cancel \; run-shell 'xdotool key --clearmodifiers ctrl+shift+equal'
bind-key -T copy-mode C-WheelDownPane send-keys -X cancel \; run-shell 'xdotool key --clearmodifiers ctrl+shift+minus'
bind-key -T copy-mode-vi C-WheelUpPane send-keys -X cancel \; run-shell 'xdotool key --clearmodifiers ctrl+shift+equal'
bind-key -T copy-mode-vi C-WheelDownPane send-keys -X cancel \; run-shell 'xdotool key --clearmodifiers ctrl+shift+minus'
set -g history-limit 100000

# Use a capable TERM inside panes so full-screen TUIs such as Codex redraw
# cleanly.  Kitty's true-colour support is declared explicitly.
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-kitty:RGB'

# semantic “cop” operator
bind-key -T root User1 {
  display-message "cop invoked"
  copy-mode -e
  send-keys -X previous-prompt
  send-keys -X begin-selection
  send-keys -X next-prompt
  send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
}

# binding the shortcut prefix t to the cop operator
unbind-key -T prefix t
bind-key -T prefix t send-keys -K User1

# toggle to previously used window
bind-key ^ last-window

# pane navigation (vim-style)
bind-key h select-pane -L
bind-key l select-pane -R

# make sourcing easier
bind-key r source-file ~/.tmux.conf \; display-message "tmux reloaded"



# Jump to prompts from normal mode with prefix-p/n, or within copy mode
# with Ctrl-p/n. Codex does not emit OSC 133 shell-prompt markers, so match
# its user-message chevron instead. Other programs keep shell-prompt jumps.
# Codex jumps become the latest copy-mode search; n/N repeat that search.
bind-key -T prefix p copy-mode -e \; if-shell -F '#{==:#{pane_current_command},codex}' 'send-keys -X search-backward "^› "' 'send-keys -X previous-prompt'
bind-key -T prefix n copy-mode -e \; if-shell -F '#{==:#{pane_current_command},codex}' 'send-keys -X search-forward "^› "' 'send-keys -X next-prompt'
bind-key -T copy-mode-vi C-p if-shell -F '#{==:#{pane_current_command},codex}' 'send-keys -X search-backward "^› "' 'send-keys -X previous-prompt'
bind-key -T copy-mode-vi C-n if-shell -F '#{==:#{pane_current_command},codex}' 'send-keys -X search-forward "^› "' 'send-keys -X next-prompt'
bind-key -T copy-mode-vi N send-keys -X search-reverse
# Reloading tmux does not remove old bindings, so restore P explicitly.
bind-key -T copy-mode-vi P send-keys -X toggle-position


### adding the VIM keys to copy mode
bind-key -T copy-mode-vi v send -X begin-selection
# C-v = start selection, then toggle rectangle/block mode
bind-key -T copy-mode-vi C-v send -X begin-selection \; send -X rectangle-toggle

# cleaned yank: copy to clipboard, stay in copy mode, and clear the selection
# bind-key -T copy-mode-vi y send -X copy-pipe "perl -0777 -pe 's/[ \t\r\n]+\z//' | xclip -selection clipboard"
bind-key -T copy-mode-vi y send -X copy-pipe "python3 -c 'import sys; sys.stdout.write(sys.stdin.read().rstrip())' | xclip -selection clipboard"

# Mouse release copies while preserving the highlight and scroll position.
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X stop-selection \; send -X copy-pipe-no-clear "python3 -c 'import sys; sys.stdout.write(sys.stdin.read().rstrip())' | xclip -selection clipboard"

# A subsequent click clears the highlight without leaving the scroll position.
bind-key -T copy-mode-vi MouseDown1Pane send -X clear-selection \; select-pane

# add the splits open in prev directory
bind-key c new-window -c "#{pane_current_path}"
bind-key '"' split-window -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"


# # yank to X11 clipboard
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard"
## add the plugin installation
run '~/.tmux/plugins/tpm/tpm'
