[whisper]
model = "large-v3-turbo"
device = "cpu"
compute_type = "int8"
# Dictation is English-only; skipping automatic detection improves consistency
# for short prompts and avoids a small amount of work.
language = "en"
beam_size = 5
vad_filter = true
cpu_threads = 8
num_workers = 1

[queue]
max_pending = 10
max_storage_mb = 100
max_recording_seconds = 300
retention_hours = 24

[worker]
# Keep the exact same Whisper model resident between dictations. The worker is
# launched on the first recording and direct transcription remains a fallback.
enabled = true
startup_timeout_seconds = 20.0
request_timeout_seconds = 300.0
fallback_to_direct = true

[recording]
command = "pw-record"
# Mark this as communications capture so WirePlumber automatically exposes a
# connected Bluetooth headset microphone instead of leaving it in A2DP-only
# playback mode.
media_category = "Capture"
media_role = "Communication"
sample_rate = 16000
channels = 1
sample_format = "s16"
minimum_seconds = 0.25
stop_timeout_seconds = 5.0

[recording.feedback]
enabled = true
interval_seconds = 0.75
activity_threshold_dbfs = -45.0
silence_warning_seconds = 3.0
notification_expire_ms = 2200

[paste]
clipboard_command = "xclip"
xdotool_command = "xdotool"
# Ctrl+Shift+V is the normal paste shortcut in terminals, including kitty.
hotkey = "ctrl+shift+v"
delay_ms = 100
focus_original_window = true
# Maximum time to wait after asking i3 to restore the original X11 window.
focus_timeout_ms = 1000

[notifications]
enabled = true
command = "notify-send"
