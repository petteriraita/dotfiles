[whisper]
model = "large-v3-turbo"
device = "cpu"
compute_type = "int8"
# Leave blank for automatic language detection, or use e.g. "en".
language = ""
beam_size = 5
vad_filter = true
cpu_threads = 8
num_workers = 1

[recording]
command = "pw-record"
sample_rate = 16000
channels = 1
sample_format = "s16"
minimum_seconds = 0.25
stop_timeout_seconds = 5.0

[paste]
clipboard_command = "xclip"
xdotool_command = "xdotool"
# Ctrl+Shift+V is the normal paste shortcut in terminals, including kitty.
hotkey = "ctrl+shift+v"
delay_ms = 100
focus_original_window = true

[notifications]
enabled = true
command = "notify-send"
